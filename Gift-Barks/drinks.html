<!-- Drinks Buttons -->
<div id="drink-buttons"></div>

<!-- cart -->
<div id="cart">
    <h2>Your Order</h2>
    <ul id="order-list"></ul>
    <p id="total-price">Total: €0</p>
    <button id="confirm-btn" onclick="confirmPurchase()">Confirm Purchase</button>
</div>

<script>
  let drinks = {
    'Wine': 5,
    'Beer': 4,
    'Cocktail': 7,
    'Singing Scotch': 10,
    'Mario Martini': 10,
    'Luigi Lager': 10,
    'The Perkymon': 10,
    'Minecraft Potion': 10
  };

  let stock = {};
  let cart = {};

  // Initialize stock with random amounts
  function initializeStock() {
      for (let drink in drinks) {
          stock[drink] = Math.floor(Math.random() * 10) + 1; // Random stock between 1 and 10
          cart[drink] = 0;
      }
  }

  // Render drink buttons  (creates buttons for individual beverages automatically)
  function renderDrinkButtons() {
      let drinkContainer = document.getElementById("drink-buttons");
      drinkContainer.innerHTML = "";
    //creates button for each drink
      for (let drink in drinks) {
          let button = document.createElement("button");
          button.textContent = `${drink} €${drinks[drink]} - Available: ${stock[drink]}`;
          button.onclick = () => orderDrink(drink, drinks[drink]);
          button.id = `btn-${drink}`;
          drinkContainer.appendChild(button);
      }
  }
  //adds drinks to the cart
  function orderDrink(drinkName, price) {
      if (cart[drinkName] < stock[drinkName]) {
          cart[drinkName]++;
          updateCart();
          updateStockDisplay();
      } else {
          alert(`Sorry, only ${stock[drinkName]} of ${drinkName} are available.`);
      }
  }

  function updateCart() {
      let orderList = document.getElementById("order-list");
      let totalPrice = 0;
      orderList.innerHTML = ""; // Clear the list
//shows whats in the cart and updates the list of drinks in the menu
      for (let drink in cart) {
          if (cart[drink] > 0) {
              let itemTotal = cart[drink] * drinks[drink];
              totalPrice += itemTotal;

              let li = document.createElement("li");
              li.textContent = `${drink} x${cart[drink]} (€${itemTotal})`;
              orderList.appendChild(li);
          }
      }

      document.getElementById("total-price").textContent = `Total: €${totalPrice}`;
  }
//updates the drink buttons to display right amount of drinks
  function updateStockDisplay() {
      for (let drink in stock) {
          let button = document.getElementById(`btn-${drink}`);
          if (button) {
              button.textContent = `${drink} €${drinks[drink]} - Available: ${stock[drink] - cart[drink]}`;
          }
      }
  }

  function confirmPurchase() {
      if (Object.values(cart).every(count => count === 0)) {
          alert("Your cart is empty!");
      } else {
          alert("Purchase confirmed! Thank you for your order.");
          
          // Deduct purchased items from stock
          for (let drink in cart) {
              stock[drink] -= cart[drink];
              cart[drink] = 0;
          }
          
          updateCart();
          updateStockDisplay();
      }
  }

  // Initialize and render everything on page load
  initializeStock();
  renderDrinkButtons();

</script>
