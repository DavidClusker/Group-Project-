<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Giftbarx Login & Registration</title>
  <link rel="styleSheet" href="bootstrap.min.css">
<link rel="stylesheet" href="main.css">
</head>
<body>
  <!-- *** HIGHLIGHT: This HTML runs the webpage structure without MongoDB *** -->
  <div class="main">
    <!-- Login Form -->
    <form class="form" id="loginForm">
      <h1 class="form-title">Login</h1>
      <div class="form-input-group">
        <input type="text" id="loginUsername" class="form-input" autofocus placeholder="Username" required>
      </div>
      <div class="form-input-group">
        <input type="password" id="loginPassword" class="form-input" placeholder="Password" required>
      </div>
      <button class="form-button" type="submit">Continue</button>
      <p class="form-text">
        <a href="#" class="form-link">Forgot your password?</a>
      </p>
      <p class="form-text">
        <a href="#" id="linkCreateAccount" class="form-link">Don't have an account? Create one</a>
      </p>
    </form>

    <!-- Registration Form -->
    <form class="form" id="registerForm" style="display: none;">
      <h1 class="form-title">Create Account</h1>
      <div class="form-input-group">
        <input type="text" id="regUsername" class="form-input" autofocus placeholder="Username" required>
      </div>
      <div class="form-input-group">
        <input type="email" id="regEmail" class="form-input" placeholder="Email address" required>
      </div>
      <div class="form-input-group">
        <input type="password" id="regPassword" class="form-input" placeholder="Password" required>
      </div>
      <div class="form-input-group">
        <input type="date" id="regDOB" class="form-input" placeholder="Date of Birth" required>
      </div>
      <button class="form-button" type="submit">Continue</button>
      <p class="form-text">
        <a href="#" id="linkLogin" class="form-link">Already have an account? Sign in</a>
      </p>
    </form>
  </div>

  <script>
    // *** HIGHLIGHT: This JavaScript runs the form toggling without MongoDB *** */
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const linkCreateAccount = document.getElementById('linkCreateAccount');
    const linkLogin = document.getElementById('linkLogin');

    linkCreateAccount.addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
    });

    linkLogin.addEventListener('click', (e) => {
      e.preventDefault();
      registerForm.style.display = 'none';
      loginForm.style.display = 'block';
    });

    // Optional: Add basic form submission feedback without backend
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Login form submitted (no backend)');
    });

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Registration form submitted (no backend)');
    });
  </script>
</body>
</html>
